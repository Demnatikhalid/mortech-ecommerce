version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mortech-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mortech_secure_password
      POSTGRES_DB: mortech_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  waf:
    build: ./waf
    container_name: mortech-waf
    restart: always
    ports:
      - '8888:8888'
    volumes:
      - ./waf:/waf
    environment:
      - TARGET_HOST=http://host.docker.internal:5000
      - LISTEN_PORT=8888
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
